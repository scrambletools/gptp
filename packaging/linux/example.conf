# gptpd's settings for one interface, as /etc/gptpd/INTERFACE.conf.
# A missing file, or a missing setting, means its default.

# 1 to 255: lower wins the grandmaster election, and 255 is never
# grandmaster. 248 by default, as Milan asks of an endpoint.
#priority1 248

# auto: gPTP, falling back to AVB Lite where no AVB bridge is the
# neighbor (the default); gptp: gPTP only; avb-lite: AVB Lite only.
#profile auto

# Whether the port says each second that it runs gPTP, in Signaling
# (802.1AS-2020 10.6.4.4). yes by default.
#gptp-capable yes
