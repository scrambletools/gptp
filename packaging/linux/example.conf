# gptpd's settings for one interface, as /etc/gptpd/INTERFACE.conf.
# A missing file, or a missing setting, means its default.

# 1 to 255: lower wins the grandmaster election, and 255 is never
# grandmaster. 248 by default, as Milan asks of an endpoint.
#priority1 248

# auto: gPTP, falling back to AVB Lite where no AVB bridge is the
# neighbor (the default); gptp: gPTP only; avb-lite: AVB Lite only.
#profile auto

# Whether the port says each second that it runs gPTP, in Signaling
# (802.1AS-2020 10.6.4.4). yes by default.
#gptp-capable yes

# Whether the port's hardware clock is kept near CLOCK_TAI, slewed by its
# rate, so a card that sends a frame when its clock reaches the frame's
# launch time (the ETF queue discipline with offload, as AVB talkers use
# it) sends it on time. gptpd's own time does not move with it, and the
# record says how far the clock stands from CLOCK_TAI. Never while this
# system is grandmaster. no by default.
#follow-tai no

# How many Sync intervals, 125 ms each, may pass with no Sync from the
# grandmaster before the port lets it go and the election runs again
# (802.1AS-2020 syncReceiptTimeout), 1 to 255. A switch that stops
# sending Sync for a second or so after one Pdelay exchange it doubts,
# as some do, makes this system grandmaster for that second at the
# default; 16 rides it out. 3 by default.
#sync-receipt-timeout 3

# An 802.11 port's: nanoseconds to add to each Ack's arrival as the
# radio stamped it, for a radio that stamps Acks early, which a station
# measuring with FTM sees as a round trip too short or below 0. A bridge
# reads this alone from an 802.11 port's file. 0 by default.
#ack-offset 0

# An 802.11 port's: seconds the station measured may go without an FTM
# Request before another associated station asking for FTM takes the
# port, 0 to 3600. Its radio stamps one station's frames at a time, so a
# station that never asks, as one following the beacons' time, would
# otherwise hold it while it stays associated. A bridge reads this from
# an 802.11 port's file too. 0, the default, keeps the first station.
#ftm-move-on 0

# An access point's 802.11 port's: yes answers every associated station
# asking for FTM, not only the station measured, one burst at a time,
# the radio stamping the frames of each burst's station in turn. A
# station asking during another's burst is answered when it ends, if
# within 10 ms; later, it asks again. A bridge reads this from an
# 802.11 port's file too. no by default.
#ftm-share no

# A bridge's, from the bridge's own file (/etc/gptpd/BRIDGE.conf), as
# working-clock-sync-interval is: as gptpd starts, take the grandmaster the
# bridge followed before at once, as it keeps it in
# /var/lib/gptpd/BRIDGE.grandmaster, and any other only after three
# Announce intervals. A neighbor reaching the
# grandmaster only through this bridge makes itself grandmaster while
# gptpd restarts, and would otherwise be followed until the grandmaster's
# own Announce comes. no by default.
#wait-for-grandmaster no

# The port's role in the working clock, domain 1, beside domain 0:
# timetransmitter, timereceiver or passive (802.1AS-2020 10.3.15), its
# links measured by the Common Mean Link Delay Service 32 times a second.
# A system whose ports carrying it are all timetransmitter is its
# grandmaster, with arbitrary time from its own oscillator. An end
# station writes its time to /run/gptpd/INTERFACE.d1.time. A bridge
# reads this from each port's file. no by default: the port carries none.
#working-clock no

# The working clock's Sync interval, log2 of seconds, -8 to 0: -7 sends
# 128 a second. A bridge reads this from the bridge's own file. -7 by
# default.
#working-clock-sync-interval -7
