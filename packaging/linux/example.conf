# gptpd's settings for one interface, as /etc/gptpd/INTERFACE.conf.
# A missing file, or a missing setting, means its default.

# 1 to 255: lower wins the grandmaster election, and 255 is never
# grandmaster. 248 by default, as Milan asks of an endpoint.
#priority1 248

# auto: gPTP, falling back to AVB Lite where no AVB bridge is the
# neighbor (the default); gptp: gPTP only; avb-lite: AVB Lite only.
#profile auto

# Whether the port says each second that it runs gPTP, in Signaling
# (802.1AS-2020 10.6.4.4). yes by default.
#gptp-capable yes

# Whether the port's hardware clock is kept near CLOCK_TAI, slewed by its
# rate, so a card that sends a frame when its clock reaches the frame's
# launch time (the ETF queue discipline with offload, as AVB talkers use
# it) sends it on time. gptpd's own time does not move with it, and the
# record says how far the clock stands from CLOCK_TAI. Never while this
# system is grandmaster. no by default.
#follow-tai no

# How many Sync intervals, 125 ms each, may pass with no Sync from the
# grandmaster before the port lets it go and the election runs again
# (802.1AS-2020 syncReceiptTimeout), 1 to 255. A switch that stops
# sending Sync for a second or so after one Pdelay exchange it doubts,
# as some do, makes this system grandmaster for that second at the
# default; 16 rides it out. 3 by default.
#sync-receipt-timeout 3
