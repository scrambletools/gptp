[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scrambletools/gptp"
readme = "README.md"

[workspace.dependencies]
# The protocol crate depends on nothing, and builds without std when its
# default feature is off; raw-ether is the daemon's platform code.
gptp = { path = "crates/gptp", version = "0.1.0" }
raw-ether = { path = "crates/raw-ether", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
