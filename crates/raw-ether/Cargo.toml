[package]
name = "raw-ether"
description = "Raw Ethernet on Linux, macOS and Windows: MAC addresses, interfaces, frames with hardware time stamps, PTP hardware clocks and captures"
version = "0.1.0"
categories = ["network-programming", "no-std"]
keywords = ["ethernet", "raw-socket", "ptp", "timestamping", "tsn"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Interfaces and frame I/O on Linux, macOS and Windows. Without it only the
# address types remain, for protocol crates built for microcontrollers.
std = ["dep:libc", "dep:windows-sys"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[[example]]
name = "phc_watch"
required-features = ["std"]

[[example]]
name = "netraw"
required-features = ["std"]

[[example]]
name = "link_power"
required-features = ["std"]
